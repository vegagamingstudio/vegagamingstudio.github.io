<!doctype html>
<html lang="en">
<head>

  <style>
    :root { --bg:#f7f5f0; --fg:#1d1b18; --muted:#6b665d; --accent:#8a5a1f; }

    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width:640px; margin:0 auto; padding:64px 20px; }
    .studio { color:var(--muted); letter-spacing:.08em; text-transform:uppercase; font-size:13px; margin:0; }
    h1 { font-size:40px; line-height:1.15; margin:8px 0 16px; }
    a { color:var(--accent); }
    footer { margin-top:56px; padding-top:20px; border-top:1px solid color-mix(in srgb, var(--fg) 15%, transparent); color:var(--muted); font-size:14px; }
    footer a { margin-right:16px; }
  </style>
</head>

  <main>
    <p class="studio">Vega Gaming Studio</p>
